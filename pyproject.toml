[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lead-leak-check-mcp"
version = "0.1.0"
description = "MCP server that finds where inbound leads are silently dropped in Zapier, Make and n8n pipelines."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Paopao Studio", email = "paopaomusic@mail.grokbot.com" }]
keywords = ["mcp", "model-context-protocol", "lead management", "zapier", "make", "n8n", "crm", "automation audit"]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = ["mcp>=1.2.0,<3"]

[project.optional-dependencies]
test = ["pytest>=7", "anyio"]

[project.scripts]
lead-leak-check-mcp = "lead_leak_check.server:main"
lead-leak-check = "lead_leak_check.__main__:main"

[project.urls]
Repository = "https://github.com/paopao-studio-ai/lead-leak-check-mcp"
Homepage = "https://paopao-studio.pages.dev/?utm_source=pypi&utm_medium=oss&utm_campaign=lead_leak_1029"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_leak_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
